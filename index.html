<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Lhean & Ehron Quiz Game</title>
  </head>
  <body>
    <header>
      <nav class="navbar-container">
        <p class="nav-text">&copy; Lhean🤍Vince</p>
      </nav>
    </header>
    <main>
      <p id="score-ct" class="hidden"></p>
      <div class="hero-container">
        <p class="hero-main">A 10-item quiz about the relationship of Lhean and Ehron</p>
        <p class="hero-start-text">Press `Enter` to Start</p>
      </div>
      <div>
      <div class="question-container" id="ques-cont">
        <div class="each-ques-container" id="ques-each-cont">
          <div class="choices-container"></div>
        </div>
      </div>
      <div class="hidden" id="btn-start-next">
        <button class="restart-btn">Restart</button>
        <button class="next-btn">Next</button>
      </div>
      <p id="next-btn-warn" class="warn-text"></p>
    </main>
    <script src="main.js"></script>
  </body>
</html>
